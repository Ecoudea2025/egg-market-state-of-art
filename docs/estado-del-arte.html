<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado del Arte Completo — Observatorio Huevo UdeA</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <div class="page-header">
      <h1>Síntesis del Estado del Arte: Mercado del Huevo</h1>
      <p>Documento de revisión académica y síntesis teórica generado a partir de 333 citas textuales verificadas de 27 investigaciones especializadas.</p>
      <div class="mt-2">
        <a href="data/estado_del_arte.md" download class="btn btn-primary btn-sm">&#11015; Descargar Texto Completo (.md)</a>
      </div>
    </div>

    <div id="toc-layout" style="display:grid;grid-template-columns:280px 1fr;gap:26px;align-items:start;">
      <aside class="card" style="position:sticky;top:84px;max-height:82vh;overflow-y:auto;">
        <h3 style="font-size:0.86rem;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-secondary);margin-bottom:14px;">Tabla de Contenidos</h3>
        <div id="toc-list" style="display:flex;flex-direction:column;gap:8px;font-size:0.84rem;"></div>
      </aside>

      <div class="card">
        <div class="md-content" id="md-content">
          <p class="text-muted text-center" style="padding:40px;">Cargando documento...</p>
        </div>
      </div>
    </div>
  </main>

  <footer id="footer"></footer>
  <script src="shared.js"></script>
  <script>
  (function () {
    fetch('data/estado_del_arte.md')
      .then(function (r) { return r.text(); })
      .then(function (md) {
        var contentEl = document.getElementById('md-content');
        contentEl.innerHTML = marked.parse(md);

        // Renderizar fórmulas de LaTeX si las hay
        if (typeof renderMathInElement !== 'undefined') {
          renderMathInElement(contentEl, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$', right: '$', display: false }
            ]
          });
        }

        var headings = contentEl.querySelectorAll('h1, h2');
        var toc = document.getElementById('toc-list');
        headings.forEach(function (h, i) {
          var id = 'sec-' + i;
          h.id = id;
          var a = document.createElement('a');
          a.href = '#' + id;
          a.textContent = h.textContent;
          a.style.color = h.tagName === 'H1' ? 'var(--text-primary)' : 'var(--text-secondary)';
          a.style.fontWeight = h.tagName === 'H1' ? '700' : '400';
          a.style.paddingLeft = h.tagName === 'H2' ? '12px' : '0';
          toc.appendChild(a);
        });
      })
      .catch(function () {
        document.getElementById('md-content').innerHTML = '<p class="text-red">No se pudo cargar estado_del_arte.md</p>';
      });
  })();
  </script>
</body>
</html>
